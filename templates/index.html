<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(90deg, #6C63FF, #48cfad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #9e9e9e;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 44px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* Form grid */
        .body_form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 36px;
        }

        @media (max-width: 640px) {
            .body_form {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 28px 20px;
            }
        }

        /* Labels */
        .field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #aaa;
            margin-bottom: 8px;
        }

        /* Inputs & selects */
        .field input,
        .field select {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            appearance: none;
            -webkit-appearance: none;
        }

        .field input::placeholder {
            color: #666;
        }

        .field input:focus,
        .field select:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
        }

        /* Number input — hide spinner arrows for cleaner look */
        .field input[type="number"]::-webkit-inner-spin-button,
        .field input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* Custom select arrow */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
            font-size: 1rem;
        }

        .field select {
            padding-right: 40px;
            cursor: pointer;
        }

        .field select option {
            background: #1e1e2f;
            color: #fff;
        }

        /* Submit button */
        .btn-row {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 8px;
        }

        #sub {
            height: 54px;
            width: 100%;
            max-width: 320px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6C63FF, #48cfad);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 18px rgba(108, 99, 255, 0.35);
        }

        #sub:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(108, 99, 255, 0.5);
        }

        #sub:active {
            transform: translateY(0);
        }

        /* Prediction result */
        .result {
            text-align: center;
            margin-top: 32px;
        }

        .result-box {
            font-size: 1.15rem;
            font-weight: 600;
            padding: 18px 28px;
            border-radius: 12px;
            display: inline-block;
        }

        /* Success result (selling price) */
        .result-box.success {
            background: rgba(72, 207, 173, 0.12);
            border: 1px solid rgba(72, 207, 173, 0.3);
            color: #48cfad;
        }

        /* Error result (can't sell / invalid input) */
        .result-box.error {
            background: rgba(255, 99, 99, 0.12);
            border: 1px solid rgba(255, 99, 99, 0.3);
            color: #ff6b6b;
        }

        /* Icon accents */
        .field .icon {
            margin-right: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚗 <span>Car Price</span> Prediction</h1>
            <p>Enter your car details to estimate the selling price</p>
        </div>

        <!-- Card -->
        <div class="card">
            <form action="{{ url_for('predict')}}" method="post">
                <div class="body_form">

                    <!-- Year -->
                    <div class="field">
                        <label><span class="icon">📅</span> Year of Purchase</label>
                        <input id="first" name="Year" type="number" min="1990" max="2026" placeholder="e.g. 2015" required="required">
                    </div>

                    <!-- Present Price -->
                    <div class="field">
                        <label><span class="icon">💰</span> Showroom Price (Lakhs)</label>
                        <input id="second" name="Present_Price" type="number" step="0.01" min="0" placeholder="e.g. 5.59" required="required">
                    </div>

                    <!-- Kms Driven -->
                    <div class="field">
                        <label><span class="icon">🛣️</span> Kilometers Driven</label>
                        <input id="third" name="Kms_Driven" type="number" min="0" placeholder="e.g. 27000" required="required">
                    </div>

                    <!-- Owner -->
                    <div class="field">
                        <label><span class="icon">👤</span> Previous Owners</label>
                        <div class="select-wrapper">
                            <select id="fourth" name="Owner" required="required">
                                <option value="0">0 — First Owner</option>
                                <option value="1">1 — Second Owner</option>
                                <option value="3">3 — Third or More</option>
                            </select>
                        </div>
                    </div>

                    <!-- Fuel Type -->
                    <div class="field">
                        <label><span class="icon">⛽</span> Fuel Type</label>
                        <div class="select-wrapper">
                            <select name="Fuel_Type_Petrol" id="fuel-select" required="required">
                                <option value="Petrol">Petrol</option>
                                <option value="Diesel">Diesel</option>
                                <option value="CNG">CNG</option>
                            </select>
                        </div>
                    </div>

                    <!-- Seller Type -->
                    <div class="field">
                        <label><span class="icon">🏪</span> Seller Type</label>
                        <div class="select-wrapper">
                            <select name="Seller_Type_Individual" id="seller-select" required="required">
                                <option value="Dealer">Dealer</option>
                                <option value="Individual">Individual</option>
                            </select>
                        </div>
                    </div>

                    <!-- Transmission -->
                    <div class="field">
                        <label><span class="icon">⚙️</span> Transmission</label>
                        <div class="select-wrapper">
                            <select name="Transmission_Manual" id="transmission-select" required="required">
                                <option value="Manual">Manual</option>
                                <option value="Automatic">Automatic</option>
                            </select>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="btn-row">
                        <button id="sub" type="submit">🔍 Predict Selling Price</button>
                    </div>
                </div>
            </form>

            <!-- Prediction output -->
            {% if pred %}
            <div class="result">
                {% if "Sorry" in pred or "Please" in pred %}
                <div class="result-box error">⚠️ {{ pred }}</div>
                {% else %}
                <div class="result-box success">✅ {{ pred }}</div>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</body>

</html>
